site:
  title: Antora Documentation POC
  start_page: getting-started::index.adoc

content:
  sources:
    - url: https://github.com/antoramvp/getting-started.git
      branches: main

    - url: https://github.com/antoramvp/pos-integration.git
      branches: main

    - url: https://github.com/antoramvp/api-docs.git
      branches:
        - v1.0
        - v2.0

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/master/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files:
  - path: partials/head-meta.hbs
    contents: |
      <meta name="marketpay-test" content="YES">

output:
  dir: ./build/site
